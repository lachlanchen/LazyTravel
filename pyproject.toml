[project]
name = "lazytravel"
version = "0.1.0"
description = "Trilingual destination books and website from aligned editorial JSON"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "jsonschema>=4.22,<5",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<12",
  "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
