name: Lanzhou browser regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser test dependencies
        run: |
          python -m pip install "pytest>=8,<10" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Build and run three clean browser passes
        run: |
          python scripts/build_series_website.py
          python -m http.server 4173 --bind 127.0.0.1 --directory site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/china/cities/lanzhou/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/china/cities/lanzhou/ >/dev/null
          LAZYTRAVEL_BASE_URL=http://127.0.0.1:4173/china/cities/lanzhou/ \
            scripts/run_lanzhou_browser_regression.sh 3

      - name: Upload JUnit and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanzhou-browser-regression
          path: build/qa/playwright-regression/
          if-no-files-found: error
